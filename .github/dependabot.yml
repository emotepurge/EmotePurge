# Closes the supply-chain rest of review finding S4-16 (and keeps the S4-15 SHA pins fresh):
# Dependabot PRs instead of a hard `npm audit` gate — an advisory in a transitive dependency
# should produce a reviewable PR, not block every unrelated push to main.
version: 2
updates:
  # Keeps the commit-SHA pins in publish.yml moving (it updates the SHA and the version comment).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    # The Angular ecosystem releases in lockstep; one grouped PR per week instead of a dozen.
    # Major updates stay separate — those are migrations, not maintenance.
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
    # vitest 5 cannot be resolved here: every published @angular/build 22.1.x declares
    # peerDependencies.vitest ^4.0.8, so npm ci dies with ERESOLVE (that was PRs #101/#102).
    # The two packages also share a core and are only green together — a lone bump of either
    # one is red regardless of the peer range. This is maintenance-vs-migration, not a version
    # preference: vitest 5 breaks the config API. Lift the rule with the Angular major that
    # carries vitest 5; that upgrade brings both packages along.
    ignore:
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/coverage-v8"
        update-types: ["version-update:semver-major"]

  # Wildcards instead of "/" on purpose: the solution file is the new .slnx format, so pointing
  # at the csproj directories does not depend on Dependabot's .slnx support.
  - package-ecosystem: "nuget"
    directories:
      - "/src/*"
      - "/tests/*"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
        # A TwitchLib bump is never maintenance: it needs the live check (Rule 16) on top of green
        # CI, because the transport (line-splice handling, NoReconnectionPolicy, which Shared Chat
        # tags stay in UndocumentedTags) is verified live, not by the suites. Kept out of the group
        # so it arrives as its own PR and a reviewer cannot wave it through with the rest.
        exclude-patterns:
          - "TwitchLib.*"
    open-pull-requests-limit: 5
    # Microsoft.AspNetCore.OpenApi 10.x is pinned to the Microsoft.OpenApi 2.x line: the code that
    # ASP.NET Core 10 generates for AddOpenApi() assigns to IOpenApiMediaType.Example, which 3.x
    # made read-only, so a 3.x bump breaks the build even without our own transformers
    # (dotnet/aspnetcore#67505). The 3.x move belongs to the .NET 11 upgrade, which brings it along.
    ignore:
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]
