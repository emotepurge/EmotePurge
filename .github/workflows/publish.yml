name: Publish Docker images

# Docs-only pushes to main (Markdown, docs/) skip the whole pipeline — nothing in the images can have
# changed, and republishing would only move the :latest tag to a bit-identical image with a new
# digest (a blind Portainer re-pull would then restart containers for nothing).
# pull_request deliberately carries NO paths-ignore, unlike push: `test` and `test-web` are required
# status checks on main, and GitHub leaves a required check that never ran pending forever rather than
# treating it as passed — a docs-only PR would be permanently unmergeable. Running both jobs on a
# docs-only PR costs a few runner minutes; that is the cheaper half of the trade
# (see docs/DECISIONS.md, 2026-09-06 — "Das Quality Gate bekommt Zähne").
# The publish job stays PR-free through its own if: — no image is ever built from a pull request
# (optional branches for risky work get CI without changing the trunk-based flow, Review 2026-07-29,
# S3-37). Which of the two images it builds is decided per push by the `changes` job below.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      # Ahead of the tests on purpose: this takes ~30s and fails fast, while the test job below
      # spins up Testcontainers. Reports formatting only — no analyzer opinions are configured.
      - name: Verify formatting (dotnet format)
        run: dotnet format EmotePurge.slnx --verify-no-changes

      # Testcontainers pulls postgres:16-alpine/redis:7.2-alpine and needs the Docker daemon
      # that ubuntu-latest runners already ship with.
      - name: Run tests
        run: dotnet test EmotePurge.slnx --configuration Release

  test-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: web

      # Both run before the test steps: they take a few seconds each, so a formatting or member
      # order slip fails the job immediately instead of after Chromium has been downloaded.
      - name: Verify formatting (Prettier)
        run: npm run format:check
        working-directory: web

      - name: Lint (ESLint)
        run: npm run lint
        working-directory: web

      - name: Run unit tests (Vitest)
        run: npm test -- --watch=false
        working-directory: web

      # e2e specs mock every /api/** call (see web/e2e/support/mocks.ts) — no .NET Api/Postgres/
      # Redis/Twitch OAuth app needed here, only Chromium + the Angular dev server.
      - name: Install Playwright Chromium
        run: npx --ignore-scripts playwright install --with-deps chromium
        working-directory: web

      - name: Run e2e tests (Playwright)
        run: npm run e2e
        working-directory: web

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  # Decides which of the two images the push can actually have changed (#129). Both Dockerfiles
  # copy `src/` only (S4-17) — the Api one plus `web/` — so `web/**` and `src/EmotePurge.Api/**`
  # provably cannot alter what `dotnet publish EmotePurge.Worker.csproj` emits, and `tests/**`,
  # `docs/**` and Markdown reach neither image. Without this, every non-docs push republished
  # `emotepurge-worker:latest` under a fresh digest (nothing here is cached, so two runs of the
  # same tree differ), and because docker-compose.prod.yml pins `:latest` without a pull_policy,
  # the next Portainer redeploy restarted the worker for nothing — losing the time anchor of a
  # running observation (#117) and up to 30s of buffered counting while #122 is open.
  #
  # The classification is an allowlist of what is safe to SKIP, not a list of what to build:
  # anything unrecognised (EmotePurge.Core, EmotePurge.Infrastructure, .dockerignore, .github/**,
  # a new top-level file) falls through to building both. A path added later is therefore
  # over-built, never silently skipped — the failure mode that matters is prod running a stale
  # worker, and the harness entrypoint of #69 rides on the same image.
  changes:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.classify.outputs.matrix }}
      any: ${{ steps.classify.outputs.any }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The diff below needs the pushed-from commit, which the default depth-1 checkout omits.
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          # Via env, not inline ${{ }}, so the shell never re-parses interpolated text.
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          build_api=true
          build_worker=true
          reason="fail-safe default (no usable diff base)"

          # workflow_dispatch has no before-SHA, and a push can carry the all-zero one (branch
          # created, or force-pushed over a deleted history). Both keep the default above: an
          # undecidable diff must over-build, never skip.
          if [ "$EVENT_NAME" = "push" ] \
            && [ -n "$BEFORE_SHA" ] \
            && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then

            # --no-renames on purpose: with rename detection a file moved out of EmotePurge.Core
            # into EmotePurge.Worker would be reported under its new path only, and the Api — which
            # just lost a Core file — would be classified as unaffected. Listing both sides makes
            # the old location count too.
            changed=$(git diff --name-only --no-renames "$BEFORE_SHA" "$AFTER_SHA")

            build_api=false
            build_worker=false
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              case "$file" in
                web/*|src/EmotePurge.Api/*) build_api=true ;;
                src/EmotePurge.Worker/*) build_worker=true ;;
                # Copied into neither image; docs/** and *.md only ever arrive mixed into a code
                # push, since paths-ignore already drops the pure ones before the workflow starts.
                tests/*|docs/*|*.md) ;;
                *)
                  build_api=true
                  build_worker=true
                  ;;
              esac
            done <<< "$changed"

            reason="diff ${BEFORE_SHA}..${AFTER_SHA}"
            echo "Changed files:"
            echo "$changed" | sed 's/^/  /'
          fi

          entries=""
          if [ "$build_api" = true ]; then
            entries='{"image":"emotepurge-api","dockerfile":"src/EmotePurge.Api/Dockerfile"}'
          fi
          if [ "$build_worker" = true ]; then
            if [ -n "$entries" ]; then
              entries="${entries},"
            fi
            entries="${entries}"'{"image":"emotepurge-worker","dockerfile":"src/EmotePurge.Worker/Dockerfile"}'
          fi

          if [ -n "$entries" ]; then
            any=true
          else
            any=false
          fi

          {
            echo "matrix={\"include\":[${entries}]}"
            echo "any=${any}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Images to publish"
            echo ""
            echo "- Basis: \`${reason}\`"
            echo "- \`emotepurge-api\`: **${build_api}**"
            echo "- \`emotepurge-worker\`: **${build_worker}**"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    # Tests gate every event; images are only ever published from main (push/manual), never from PRs.
    # The `any` guard covers the case where the push touched only paths that reach no image at all
    # (a tests-only or mixed docs push): an empty matrix would otherwise fail the job outright.
    if: github.event_name != 'pull_request' && needs.changes.outputs.any == 'true'
    needs: [test, test-web, changes]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Push through BuildKit, not through the Docker daemon. Without this step build-push-action falls
      # back to the runner's `docker` driver, which hands the push to the daemon's legacy registry
      # client: that client HEADs every blob immediately after uploading it and fails hard, without
      # retry, if the HEAD comes back 404 ("unknown blob"). The first push into the brand-new
      # ghcr.io/emotepurge/emotepurge-api package died on exactly that, twice. BuildKit's own pusher
      # treats the upload's 201 as final. See docs/DECISIONS.md, 2026-09-15.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # Off on purpose: the docker driver never produced attestations, and on a public repo the
          # action would otherwise attach a mode=max provenance manifest, turning every tag into an
          # image index. Whether to publish attestations is its own decision, not a side effect of
          # switching the builder.
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
