name: SonarCloud analysis

# Replaces the GitHub-generated marketplace stub (SonarSource/sonarcloud-github-action, deprecated,
# fails on Java 17): the scanner now runs as a standalone dotnet tool with real backend AND
# frontend coverage, instead of just uploading the source code without test results.
#
# pull_request types deliberately restricted (opened/synchronize/reopened): these are the three events
# where the diff to be analyzed actually changes — a "labeled" or similar would otherwise trigger
# another, unchanged scan.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  analyze:
    # ubuntu-latest is mandatory, not just a preference: EmotePurge.Infrastructure.Tests uses Testcontainers
    # against real, ephemeral Postgres/Redis containers and therefore needs the Docker daemon that only the
    # ubuntu runners bring along (Windows/macOS runners don't have one).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # allows SonarCloud to comment on PRs with the analysis results
      security-events: write # for the SARIF upload to GitHub Code Scanning further below

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Sonar's blame and new-code attribution needs the full commit history — with a shallow
          # checkout (default: only the latest commit) Sonar treats every line as "new" and the
          # new-code metrics (coverage-on-new-code, quality gate) become meaningless.
          fetch-depth: 0

      - name: Setup JDK 21 (for the Sonar scanner)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: "21"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # Reads the SDK version from global.json (10.0.300) instead of duplicating it here — a bump
          # there therefore takes effect here automatically too.
          global-json-file: global.json

      # Must run before the Sonar "begin": the scanner reads the Angular lcov file during the "end"
      # step, which must already exist by then — so bring up Node/npm here and run the
      # Angular test run BEFORE the .NET scanner steps, not after.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci --ignore-scripts
        working-directory: web

      # Coverage deliberately via flag instead of hardwired in angular.json: wired in there it would
      # run on every local "npm test" too, even though only CI cares about it. The report ends up under
      # web/coverage/web/lcov.info — the builder appends the project name "web" to the path itself
      # (measured for real, not inferred).
      - name: Run Angular unit tests with coverage (lcov)
        run: npm test -- --watch=false --coverage --coverage-reporters=lcov
        working-directory: web

      - name: Cache Sonar packages
        id: cache-sonar-packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Sonar Scanner tool
        id: cache-sonar-scanner
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./.sonar/scanner
          key: ${{ runner.os }}-sonar-scanner

      # "update" deliberately also runs on a cache hit. With an immutable cache key and a condition
      # on it, a once-cached scanner would otherwise sit there forever — exactly the failure mode
      # that made this workflow necessary in the first place (the old scanner was rejected by the
      # server because of Java 17). The cache still serves as a warm start, but no longer decides
      # the version.
      - name: Install Sonar Scanner
        run: dotnet tool update dotnet-sonarscanner --tool-path ./.sonar/scanner

      # The token comes in via the environment, not as /d:sonar.token=. On the command line it would
      # show up in the runner's process list and in every echo of the step; the scanner reads
      # SONAR_TOKEN on its own. (Sonar rule githubactions:S7636, found on this very workflow.)
      # multicriteria e1 filters javascript:S4036 ("Make sure the PATH variable only contains fixed,
      # unwriteable directories") for the helper scripts. The rule flags every spawnSync call there
      # against a tool from the PATH — which is exactly what a local developer script is for. Anyone
      # who can manipulate the PATH is already on the machine. Three such findings in
      # coverage-local.mjs pushed new_security_rating from A to B and thereby broke the Quality Gate
      # (PR #86, the first run with a sharp gate at all). What's filtered is deliberately ONE
      # rule for ONE directory — scripts/** stays in the analysis, analogous to the Roslyn decision
      # from 2026-09-06: filter, don't disable. All other rules still apply there.
      #
      # The sub-parameter is called resourceKey, not resourcePattern — the first attempt failed
      # with "Issue patterns are misconfigured. File pattern is mandatory for each entry".
      # SonarSource no longer documents this path ("strongly advised to configure these features
      # in SonarQube UI ... not documented in this guide") and points to the web UI instead. It's
      # here anyway because a server setting is neither visible in the repo nor survives a project
      # migration. The price: if a scanner update breaks the undocumented property, the three
      # S4036 findings resurface and break the gate — the fallback then is
      # Project Settings → Analysis Scope → Ignore Issues on Multiple Criteria.
      # sonar.coverage.exclusions has included two worker files since 2026-09-09. That's not a
      # convenience, it's the flip side of Rule 11: TwitchChatManager and TwitchConnectionWatchdog
      # are the TwitchLib transports, and their verification is deliberately set up live against real
      # Twitch IRC, not against fakes (Rule 16). A unit test for it would have to rebuild TwitchLib and
      # would then be testing the rebuild instead of the transport — exactly the alibi tests the gate
      # was not made strict to catch. The pure decision logic has been pulled out of both and is very
      # much measured: TwitchWatchdogPolicy, TwitchReconnectBackoffPolicy, TwitchReconnectSignalSlot.
      # The price: in these two files the gate will never again report missing coverage — even
      # if testable logic moves in there later. Anyone adding such logic should pull it into
      # its own class instead of relying on this line.
      #
      # docs/superpowers/prototypes/** is excluded from sonar.exclusions since the "comprehensive"
      # profile switch (2026-09-15, see DECISIONS): these are throwaway HTML prototypes kept only
      # as a record cited by DECISIONS entries (e.g. the distribution-band comparison), never
      # served or built. Sonar has nothing useful to say about a page nobody ships.
      #
      # multicriteria e2 filters csharpsquid:S2325 ("methods that don't access instance data
      # should be static") project-wide. It's Sonar's own twin of Roslyn's CA1822, which
      # .editorconfig already sets to `none` repo-wide (2026-09-06, see DECISIONS: "micro-optimizations
      # with no relation to an observed problem") — leaving S2325 active here would just have the
      # same convention reappear under Sonar's own rule key instead of Roslyn's.
      #
      # multicriteria e3 filters Web:S6819 ("prefer the semantic HTML tag over the ARIA role") for
      # web/src/**/*.html only. It contradicts docs/UI-Designsprache.md §4.5 ("a permanently
      # mounted sr-only region with role="status"") and §6.1 ("one role="status" element ... the
      # shimmer blocks in an aria-hidden container") — both call for exactly the div/span-plus-role
      # pattern this rule flags in favor of <output>. <output> cannot validly hold the skeleton's
      # block-level shimmer children (its content model is phrasing content only) and has weaker
      # live-region support across screen readers than an explicit role="status". The price: for
      # these files the rule's other checks (e.g. preferring <button>/<a> over role="button"/"link")
      # are lost too, since ignore.multicriteria filters by rule key, not by which role triggered it.
      #
      # multicriteria e4 filters csharpsquid:S3776 ("Cognitive Complexity") for
      # src/EmotePurge.Api/Endpoints/*.cs. The four Map<X>Endpoints registration methods there
      # (EmoteEndpoints, VoteSessionEndpoints, ChannelEndpoints, AdminEndpoints — CC 49/38/29/24)
      # are exactly CLAUDE.md Rule 6's shape: Minimal API, no controllers, one
      # Map<X>Endpoints(this WebApplication app) per domain, handlers as lambdas. Sonar counts
      # every lambda as nesting, so the metric climbs with the route count, not with actual
      # decision logic — splitting the methods to satisfy it would scatter one domain's route
      # table across several helper methods and destroy the overview the convention exists to
      # give. The price: this also exempts the real private helpers that already sit in the same
      # files (e.g. PublishChannelSyncedAsync, ToSummaryDto, Ceilings) from S3776, because
      # ignore.multicriteria's resourceKey only supports file globs, not per-method scoping —
      # there is no narrower form the Sonar API offers (see the e1 comment above on the
      # undocumented, file-grained nature of this mechanism). Anyone adding genuinely complex
      # decision logic to one of these files should pull it into a tested, non-endpoint class
      # instead of relying on this line to cover it. Handler bodies and services elsewhere are
      # untouched — S3776 still applies there.
      - name: Sonar Scanner begin
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./.sonar/scanner/dotnet-sonarscanner begin
          /k:"emotepurge_EmotePurge"
          /o:"emotepurge"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml"
          /d:sonar.javascript.lcov.reportPaths="web/coverage/web/lcov.info"
          /d:sonar.exclusions="**/Migrations/**,src/EmotePurge.Api/wwwroot/**,web/dist/**,**/node_modules/**,docs/superpowers/prototypes/**"
          /d:sonar.coverage.exclusions="web/e2e/**,**/Migrations/**,scripts/**,src/EmotePurge.Worker/TwitchChatManager.cs,src/EmotePurge.Worker/TwitchConnectionWatchdog.cs"
          /d:sonar.qualitygate.wait=true
          /d:sonar.issue.ignore.multicriteria=e1,e2,e3,e4
          /d:sonar.issue.ignore.multicriteria.e1.ruleKey="javascript:S4036"
          /d:sonar.issue.ignore.multicriteria.e1.resourceKey="scripts/**/*.mjs"
          /d:sonar.issue.ignore.multicriteria.e2.ruleKey="csharpsquid:S2325"
          /d:sonar.issue.ignore.multicriteria.e2.resourceKey="**/*"
          /d:sonar.issue.ignore.multicriteria.e3.ruleKey="Web:S6819"
          /d:sonar.issue.ignore.multicriteria.e3.resourceKey="web/src/**/*.html"
          /d:sonar.issue.ignore.multicriteria.e4.ruleKey="csharpsquid:S3776"
          /d:sonar.issue.ignore.multicriteria.e4.resourceKey="src/EmotePurge.Api/Endpoints/*.cs"

      # --no-incremental is mandatory, not style: MSBuild otherwise skips already-built projects
      # incrementally (e.g. from a previous cache restore), and the Sonar-Scanner-MSBuild hook sees
      # only projects that were actually recompiled — skipped projects are then missing entirely
      # from the analysis report, without the build step itself showing an error.
      - name: Build (non-incremental, so the scanner sees every project)
        run: dotnet build EmotePurge.slnx --configuration Release --no-incremental

      # coverlet.collector (see tests/*/*.csproj) writes its own coverage.opencover.xml per test
      # project/run under a GUID subfolder in TestResults/ — hence the glob above instead of
      # a fixed path.
      - name: Test with coverage (OpenCover)
        run: dotnet test EmotePurge.slnx --no-build --configuration Release --collect:"XPlat Code Coverage;Format=opencover"

      # sonar.qualitygate.wait (see begin) only takes effect here: without the parameter "end" just
      # uploads and returns immediately — the Compute Engine's evaluation comes afterwards, and a red
      # gate had no consequence because the job had long since finished green by then. With the
      # parameter, "end" polls until the result and exits with a non-zero code on a red gate. The extra
      # cost is small: measured on PR #86, around six seconds between "Check Quality Gate status" and
      # the result, in both directions (red as well as green). In return, this job as a required check
      # actually means something.
      - name: Sonar Scanner end
        id: sonar_end
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./.sonar/scanner/dotnet-sonarscanner end

      # The ref check isn't belt-and-suspenders: workflow_dispatch lets you pick any branch,
      # the scanner then analyzes that ref — but sonar-to-sarif.mjs queries the issues API without
      # a branch parameter and would get the default branch's findings. Without the check, main's
      # results would depend on a foreign ref.
      #
      # Deliberately NOT on pull_request: a SARIF upload there would run against the merge ref and
      # would scramble main's alert history (alerts would "disappear" on merge and reappear
      # under new fingerprints). PR uploads can be added later in a targeted way if needed;
      # for now a main push or a deliberately manually triggered run is enough.
      #
      # Runs in the same job as the analysis (no separate job with needs): the script needs
      # .sonarqube/out/.sonar/report-task.txt, which the "end" step leaves behind in the working
      # directory — passing that across job boundaries as an artifact would be unnecessary effort
      # for the same runner checkout.
      #
      # The condition has carried a status function since sonar.qualitygate.wait: without it,
      # success() applies implicitly, and a red gate would make the "end" step fail — the two SARIF
      # steps would be skipped and Code Scanning would stay on the PREVIOUS analysis, in precisely
      # the one case where the findings actually matter. `!cancelled()` lifts the implicit guard,
      # `steps.sonar_end.conclusion != 'skipped'` catches the counter-case: if Build or Test already
      # failed, "end" never ran, there is no report-task.txt, and the script would abort with a
      # second, misleading error. The job stays red in both cases.
      - name: Generate SARIF report
        if: ${{ !cancelled() && steps.sonar_end.conclusion != 'skipped' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        run: node scripts/sonar-to-sarif.mjs
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: emotepurge_EmotePurge

      # Since sonar.qualitygate.wait, the "end" step already waits for SonarCloud's evaluation; the
      # script's own wait in scripts/sonar-to-sarif.mjs (it polls the ceTaskId from report-task.txt)
      # is still necessary — it's the guard against exporting the PREVIOUS run's findings, and it
      # also covers the case where "end" aborts because of a red gate. What gets uploaded is its
      # result (sonar.sarif). A dedicated "category" separates these alerts from those of other
      # scanners (e.g. CodeQL itself), should the repo also use those later.
      - name: Upload to GitHub Code Scanning
        if: ${{ !cancelled() && steps.sonar_end.conclusion != 'skipped' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: sonar.sarif
          category: sonarcloud
