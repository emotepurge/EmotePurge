name: emote-purge

# Production stack for Portainer: pulls prebuilt images from ghcr.io (via
# .github/workflows/publish.yml) instead of building locally. For local development
# keep using docker-compose.yml (docker compose up -d --build).

services:
  redis:
    image: redis:7.2-alpine
    container_name: emotepurge-redis
    restart: unless-stopped
    # maxmemory + eviction policy: without an upper bound, Redis grows until the host runs out of
    # memory, and then not just the role cache fails, but also channel:bot:commands and
    # worker:health:twitch — the bot would lose its control channel. All keys here are cache
    # entries with a TTL, or short-lived pub/sub messages, so allkeys-lru is therefore uncritical.
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - emotepurge-network

  postgres:
    image: postgres:16-alpine
    container_name: emotepurge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: emotepurge
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d emotepurge"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - emotepurge-network

  api:
    image: ghcr.io/emotepurge/emotepurge-api:latest
    container_name: emotepurge-api
    restart: unless-stopped
    # S2-21: the VPS hosts a second, unrelated app — without limits a runaway container
    # can take the whole host down. Starting values per review; calibrate after the
    # first load test (Modul E precedes the stress test on purpose).
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    ports:
      - "127.0.0.1:4300:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=emotepurge;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Redis__ConnectionString=redis:6379,password=${REDIS_PASSWORD}
      - Auth__Twitch__ClientId=${TWITCH_CLIENT_ID}
      - Auth__Twitch__ClientSecret=${TWITCH_CLIENT_SECRET}
      - Auth__Twitch__TokenEncryptionKey=${AUTH_TWITCH_TOKEN_ENCRYPTION_KEY}
      - Auth__Twitch__RedirectUri=https://emotepurge.app/api/auth/twitch/callback
      - Auth__Twitch__PostLoginRedirectUrl=/
      # Comma-separated. Overrides the appsettings.json array — without this the admin area is
      # reachable only by the login hardcoded there.
      - Auth__AdminTwitchLogins=${ADMIN_TWITCH_LOGINS}
      # Without a persisted key ring, every container restart generates a new one and throws out
      # all logged-in users; with two Api replicas, logins would fail sporadically.
      - DataProtection__KeyPath=/keys
      # Operator-supplied imprint/privacy Markdown (issue #247), read-only — see
      # docs/Operations.md "Legal pages" for the expected file names (imprint.de.md etc.) and why
      # German is authoritative. An empty or missing /opt/emotepurge/legal is a supported "nothing
      # configured yet" state (the endpoints answer 404, the frontend shows no footer link), not a
      # startup error, so this line is safe to ship before the operator has filled the directory in.
      - Legal__ContentPath=/legal
      # Contact form (docs/DECISIONS.md 2026-09-24, docs/Operations.md "Contact form"). Every value
      # defaults to empty in .env.example — an incomplete configuration is a supported "not
      # available" state (ContactOptions.IsAvailable), not a startup error, so these lines are safe
      # to ship before the operator has filled .env in.
      - Contact__Smtp__Host=${CONTACT_SMTP_HOST}
      - Contact__Smtp__Port=${CONTACT_SMTP_PORT:-587}
      - Contact__Smtp__Username=${CONTACT_SMTP_USERNAME}
      - Contact__Smtp__Password=${CONTACT_SMTP_PASSWORD}
      - Contact__Smtp__Security=${CONTACT_SMTP_SECURITY:-StartTls}
      - Contact__FromAddress=${CONTACT_FROM_ADDRESS}
      - Contact__ToAddress=${CONTACT_TO_ADDRESS}
      - Contact__Turnstile__SiteKey=${TURNSTILE_SITE_KEY}
      - Contact__Turnstile__SecretKey=${TURNSTILE_SECRET_KEY}
      # Immutable Twitch broadcaster IDs whose channel may not be (re)joined for chat observation
      # (GDPR Art. 21 objection, issue #252, see IExcludedChannelFilter) — comma-separated,
      # checked by the join endpoint before any row is written. No caller, including a global admin,
      # is exempt; the operator removing an id here is the only way to undo it.
      - Channels__ExcludedChannelIds=${EXCLUDED_CHANNEL_IDS:-}
    volumes:
      - dataprotection-keys:/keys
      - /opt/emotepurge/legal:/legal:ro
    networks:
      - emotepurge-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: ghcr.io/emotepurge/emotepurge-worker:latest
    container_name: emotepurge-worker
    restart: unless-stopped
    # #122: Docker's default for stop is 10 s until SIGKILL. The .NET `ShutdownTimeout` of the
    # host deliberately stays at the default of 30 s (a second budget in code buys nothing as long
    # as Docker holds the larger one) — but hosted services stop sequentially in reverse
    # registration order (WorkerServiceRegistration.cs), and eight other services stop before the
    # UsageFlushWorker, which is registered second. 60 s covers the 30 s with margin, so the final
    # flush arrives predictably instead of being cut off by SIGKILL (Concept 4.6, G3).
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=emotepurge;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Redis__ConnectionString=redis:6379,password=${REDIS_PASSWORD}
      # 7TV EventAPI live updates (default off): rollout/rollback via env change without a rebuild.
      - SevenTv__EventApi__Enabled=${SEVENTV_EVENTAPI_ENABLED:-false}
      - SevenTv__ResyncIntervalSeconds=${SEVENTV_RESYNC_INTERVAL_SECONDS:-60}
      # Client credentials for the Helix live poll (A10) — the same Twitch app as the Api,
      # but its own App Access Token (no user token, no scopes).
      - Auth__Twitch__ClientId=${TWITCH_CLIENT_ID}
      - Auth__Twitch__ClientSecret=${TWITCH_CLIENT_SECRET}
      - Twitch__LivePollIntervalSeconds=${TWITCH_LIVE_POLL_INTERVAL_SECONDS:-300}
      # Channel-specific bots that appear on no third-party list (see IBotChatterDetector) —
      # comma-separated Twitch user IDs, supplements the built-in static list without a release.
      - Twitch__AdditionalBotAccountIds=${TWITCH_ADDITIONAL_BOT_ACCOUNT_IDS:-}
      # Twitch user IDs of chatters who objected to processing (GDPR Art. 21, issue #252, see
      # IExcludedChatterFilter) — comma-separated, dropped before any counting or classification.
      # Takes effect on the next worker restart; empty by default changes nothing.
      - Twitch__ExcludedChatterIds=${TWITCH_EXCLUDED_CHATTER_IDS:-}
      # Same block list as the Api's join endpoint (GDPR Art. 21, issue #252): read by
      # ChannelIdentityService, which the worker's identity reconcile uses too — a duplicate row for
      # a blocked id is left unmerged rather than auto-reactivated. See IExcludedChannelFilter.
      - Channels__ExcludedChannelIds=${EXCLUDED_CHANNEL_IDS:-}
      # Data retention (#243/#244, DataRetentionWorker): false (the default) only counts and warns,
      # true actually deletes. Flip this after watching a dry run's log line, not before — a Stack
      # Update is all it takes, no image rebuild.
      - Retention__Enforce=${RETENTION_ENFORCE:-false}
    networks:
      - emotepurge-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # #69: the accuracy probe of the chat-log backfill, a second entry point of the same
  # Worker image, not a hosted service (see DECISIONS "Der Harness ist ein zweiter Einstiegspunkt
  # des Worker-Images, kein Hosted Service"). Never runs through `up`, only through
  # `docker compose -f docker-compose.prod.yml --profile harness run --rm harness <channel> [--days <n>] [--diagnostic]`,
  # or, to recompute an existing run's report with zero archive requests (#119),
  # `docker compose -f docker-compose.prod.yml --profile harness run --rm harness <channel> --report-only <file>` —
  # after a prior `pull harness` (otherwise `:latest` quietly keeps running the old one).
  harness:
    image: ghcr.io/emotepurge/emotepurge-worker:latest
    profiles: ["harness"]
    restart: "no"
    # `docker compose run` appends its arguments to the entrypoint, not to command — a
    # `command` here would be replaced, and a `run` without arguments would land at the full worker
    # startup instead of in HarnessCommandLine.Parse's invalid branch (Codex adversarial "Fail-open CLI").
    entrypoint: ["dotnet", "EmotePurge.Worker.dll", "harness"]
    healthcheck:
      # The image's heartbeat check measures WorkerHealthPublisher; that doesn't exist here.
      disable: true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=emotepurge;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      # The harness itself never publishes or subscribes to anything over Redis (Rule 4) — but
      # IChannelService hangs, via IRedisPublisher, off the same eagerly-connecting
      # IConnectionMultiplexer singleton as the Worker (ServiceCollectionExtensions, no
      # abortConnect=false); without reachable Redis at startup, resolving HarnessRunner already
      # fails before the actual run begins.
      - Redis__ConnectionString=redis:6379,password=${REDIS_PASSWORD}
      - SevenTv__EventApi__Enabled=${SEVENTV_EVENTAPI_ENABLED:-false}
      - SevenTv__ResyncIntervalSeconds=${SEVENTV_RESYNC_INTERVAL_SECONDS:-60}
      - Auth__Twitch__ClientId=${TWITCH_CLIENT_ID}
      - Auth__Twitch__ClientSecret=${TWITCH_CLIENT_SECRET}
      - Twitch__LivePollIntervalSeconds=${TWITCH_LIVE_POLL_INTERVAL_SECONDS:-300}
      # Unlike the other lines above (SevenTv__*, Twitch__LivePollIntervalSeconds,
      # Auth__Twitch__*), this line is NOT dead for the harness: BotChatterDetector reads it
      # in, and the set flows directly into the run identity via KnownBotAccountIds
      # (HarnessRunIdentity.BotAccountIds). A later cleanup round that removes the dead lines
      # would silently change the bot classification here, and thus the measured number.
      - Twitch__AdditionalBotAccountIds=${TWITCH_ADDITIONAL_BOT_ACCOUNT_IDS:-}
      - Harness__OutputDirectory=/data/harness
      - Harness__MaxMegabytesPerRun=${HARNESS_MAX_MEGABYTES_PER_RUN:-200}
      - Harness__SharedChatCutover=${HARNESS_SHARED_CHAT_CUTOVER:-}
    volumes:
      - ./harness-reports:/data/harness
    networks:
      - emotepurge-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
    driver: local
  dataprotection-keys:
    driver: local

networks:
  emotepurge-network:
    driver: bridge
